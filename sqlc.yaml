# sqlc configuration (v2) — wires the one golang-migrate schema (AD-11) to
# per-module store generation. Each module's repository adapter is generated
# from the forward migration files, so the generated Go always matches the
# shipped schema.
#
# The schema inputs are SCOPED per module (AD-8/AD-11): the User store is
# generated only from the User-owned migrations, the Admin store only from the
# Admin-owned ones. This keeps ownership clean — no module's generated package
# carries another module's tables (e.g. the Admin store never contains user
# tables, the User store never contains smtp_settings). The migrations
# themselves stay in the single golang-migrate set (the schema authority);
# only the sqlc input lists are partitioned here.
#
# IMPORTANT: when a new forward migration lands, append it to ITS owning
# module's schema list below (in numeric order — sqlc applies the files in
# order, so ALTERs must follow the CREATEs they extend).
version: "2"
sql:
  - engine: "postgresql"
    # User Directory & Auth module — the migrations that build/alter the
    # User-owned tables (users, sessions, login_attempts, audit_log,
    # password_reset_tokens, permissions + groups, user_groups,
    # qualifications, ...). Excludes the Admin-owned smtp_settings (000017).
    schema:
      - "./migrations/000001_cold_start.up.sql"
      - "./migrations/000002_user_registration.up.sql"
      - "./migrations/000003_auth_sessions.up.sql"
      - "./migrations/000004_login_attempts.up.sql"
      - "./migrations/000005_user_totp.up.sql"
      - "./migrations/000006_audit_log.up.sql"
      - "./migrations/000007_user_profile.up.sql"
      - "./migrations/000008_password_reset.up.sql"
      - "./migrations/000009_admin_recovery.up.sql"
      - "./migrations/000010_base_permissions.up.sql"
      - "./migrations/000011_fuehrende_tools.up.sql"
      - "./migrations/000012_user_groups_qualifications.up.sql"
      - "./migrations/000013_admin_rework.up.sql"
      - "./migrations/000014_admin_otp.up.sql"
      - "./migrations/000015_drop_qualification_vocab_expiry.up.sql"
      - "./migrations/000016_user_account_approve_permission.up.sql"
    queries: "./internal/user/adapters/postgres/queries.sql"
    gen:
      go:
        package: "postgres"
        out: "./internal/user/adapters/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
  # Story 3.1 + 3.2 + 4.1: the Admin hexagon's own store (Epic 3 settings).
  # Schema scoped to the Admin-owned migrations only. The user block stays at
  # 000016; 000017/000018/000019 are Admin-owned (schedules appended here per
  # Story 4.1, AD-16).
  - engine: "postgresql"
    schema:
      - "./migrations/000017_smtp_settings.up.sql"
      - "./migrations/000018_backup_destinations.up.sql"
      - "./migrations/000019_schedules.up.sql"
    queries: "./internal/admin/adapters/postgres/queries.sql"
    gen:
      go:
        package: "postgres"
        out: "./internal/admin/adapters/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
  # Story 4.2: the Tool hexagon's own store (Epic 4). Schema scoped to the
  # Tool-owned migrations only. The tool_types + tool_type_checklist_items
  # tables reference the Admin schedules catalog and the User qualifications
  # vocabulary by FK, but the Tool module never joins those modules' tables —
  # the write path validates the FKs through the modules' read-only ports
  # (AD-7/AD-10/AD-11).
  - engine: "postgresql"
    schema:
      - "./migrations/000021_tool_types.up.sql"
      - "./migrations/000022_tool_type_checklist_items_unique_position.up.sql"
      - "./migrations/000023_tool_type_qualification_optional.up.sql"
    queries: "./internal/tools/adapters/postgres/queries.sql"
    gen:
      go:
        package: "postgres"
        out: "./internal/tools/adapters/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true